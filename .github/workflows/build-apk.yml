name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project from web files
        run: |
          set -e
          P=apkbuild
          PKG=dz/municipal/seats
          mkdir -p $P/app/src/main/assets/www
          mkdir -p $P/app/src/main/java/$PKG
          mkdir -p $P/app/src/main/res/values
          mkdir -p $P/app/src/main/res/drawable
          mkdir -p $P/app/src/main/res/mipmap-anydpi-v26

          # الملفات الأصلية للتطبيق (من جذر المستودع)
          cp index.html sw.js manifest.webmanifest icon.svg $P/app/src/main/assets/www/

          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'AlgeriaElectionCalculator'
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'dz.municipal.seats'
              compileSdk 34

              defaultConfig {
                  applicationId 'dz.municipal.seats'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|layoutDirection|locale|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $P/app/src/main/java/$PKG/MainActivity.java <<'EOF'
          package dz.municipal.seats;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {

              private static final String HOST = "appassets.androidplatform.net";
              private WebView web;

              public class Bridge {
                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              doPrint();
                          }
                      });
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(0xFF123B35);

                  web = new WebView(this);
                  setContentView(web);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .setDomain(HOST)
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);

                  web.addJavascriptInterface(new Bridge(), "AndroidBridge");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if (HOST.equals(u.getHost())) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception ignored) {
                          }
                          return true;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          view.evaluateJavascript("window.print=function(){AndroidBridge.print();};", null);
                      }
                  });

                  web.loadUrl("https://" + HOST + "/assets/www/index.html");
              }

              private void doPrint() {
                  PrintManager pm = (PrintManager) getSystemService(PRINT_SERVICE);
                  pm.print("seats", web.createPrintDocumentAdapter("seats"), new PrintAttributes.Builder().build());
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > $P/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">حاسبة المقاعد</string>
          </resources>
          EOF

          cat > $P/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#123B35</color>
          </resources>
          EOF

          cat > $P/app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <group
                  android:scaleX="0.1172"
                  android:scaleY="0.1172"
                  android:translateX="24"
                  android:translateY="24">
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M100 360h312v42H100zm28-38V190l128-80 128 80v132h-48V215l-80-50-80 50v107z" />
                  <path
                      android:fillColor="#69C5A2"
                      android:pathData="M220 250h72v72h-72z" />
              </group>
          </vector>
          EOF

          cat > $P/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF

          find $P -type f | sort

      - name: Build APK
        run: gradle -p apkbuild assembleDebug

      - name: Rename APK
        run: cp apkbuild/app/build/outputs/apk/debug/app-debug.apk Algeria-Election-Calculator.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Algeria-Election-Calculator-APK
          path: Algeria-Election-Calculator.apk
          if-no-files-found: error

      - name: Publish APK as a release (direct download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest Algeria-Election-Calculator.apk \
            --title "Algeria Election Calculator (APK)" \
            --notes "Latest debug build. Download the APK and install it."
